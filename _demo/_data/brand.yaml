# Legacy single-file brand config — kept intentionally: the sections below
# still resolve from here (no dedicated `_data/brand/*.yaml` file defines
# them), exercising the files -> legacy -> defaults fallback chain.
fontStacksContexts:
  - name: main
    body:
      native: system-ui
    heading:
      native: system-ui
    code:
      native: monospace-code
customFontsImport: []
typeScales:
  - name: main
    minFontSize: 18
    maxFontSize: 20
    minTypeScale: 1.2
    maxTypeScale: 1.25
