name: Release

# Publishes to npm and creates the GitHub release when a v* tag is pushed.
# Cut a release with `npm run release:patch|minor|major` (see README).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_ENV" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_ENV" ;;
          esac

      - name: Install
        run: npm ci --ignore-scripts

      - name: Publish
        run: npm publish --provenance --access public --tag "$dist_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: |
          prerelease=""
          if [ "$dist_tag" = "next" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
        env:
          GH_TOKEN: ${{ github.token }}
