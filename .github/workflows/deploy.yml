name: Deploy Site

env:
  BUILD_PATH: "."
  BASE_URL: ${{ vars.BASE_URL }}
  PROD_URL: ${{ vars.PROD_URL }}
  CONTENT_DIR: ${{ vars.CONTENT_DIR }}
  CMS_AUTH_URL: ${{ vars.CMS_AUTH_URL }}
  PROD_BRANCH: ${{ vars.PROD_BRANCH }}
  CMS_IMPORT: ${{ vars.CMS_IMPORT }}
  CMS_REPO: ${{ vars.CMS_REPO }}
  CMS_BACKEND: ${{ vars.CMS_BACKEND }}
  CMS_BRANCH: ${{ vars.CMS_BRANCH }}
  _VARS: ${{ toJson(vars) }}
  REPO_URL: ${{ github.event.repository.html_url }}
  # Optional: override Bun version. Falls back to package.json engines.bun if unset.
  BUN_VERSION: ${{ vars.BUN_VERSION }}
  # Deploy contract: provider-neutral DEPLOY_* vars with legacy CLOUDFLARE_*
  # fallback. Mirrors template/.github/workflows/deploy.yml — keep in sync.
  # DEPLOY_TOKEN/DEPLOY_ACCOUNT_ID secrets are deliberately NOT mapped here:
  # the names are custody-agnostic — opaque console token on managed sites,
  # the site's own provider credential on connected sites — so each step
  # binds them raw, only where its deploy path needs them.
  DEPLOY_PROVIDER: ${{ vars.DEPLOY_PROVIDER }}
  DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT || vars.CLOUDFLARE_PROJECT_NAME }}
  DEPLOY_API_BASE: ${{ vars.DEPLOY_API_BASE || vars.CLOUDFLARE_API_BASE_URL }}
  # Console vend path only — Pages Functions controls (SPEC §Containment
  # addendum). FUNCTIONS_EXCLUDE drops route paths before bundling (e.g.
  # admin/cms-auth on turnkey sites); COMPAT_* feeds the worker metadata.
  DEPLOY_FUNCTIONS_EXCLUDE: ${{ vars.DEPLOY_FUNCTIONS_EXCLUDE }}
  DEPLOY_COMPAT_DATE: ${{ vars.DEPLOY_COMPAT_DATE }}
  DEPLOY_COMPAT_FLAGS: ${{ vars.DEPLOY_COMPAT_FLAGS }}

on:
  # Runs on pushes to any branch (unless commit contains [skip ci]).
  # main -> production deploy; any other branch -> provider preview URL.
  push:
    branches:
      - "**"
  # Manual deployment with platform selection
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Choose deployment target"
        required: true
        default: "cloudflare-pages"
        type: choice
        options:
          - github-pages
          - cloudflare-pages

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Check if we should skip CI and determine deployment target
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
      deployment_target: ${{ steps.target.outputs.deployment_target }}
      deploy_path: ${{ steps.target.outputs.deploy_path }}
      bun_version: ${{ steps.bun.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for [skip ci] in commit message
        id: check
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$HEAD_COMMIT_MESSAGE" == *"[skip ci]"* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Found [skip ci] in commit message, skipping workflow"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine deployment target
        id: target
        if: steps.check.outputs.should_skip == 'false'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.deployment_target }}"
          elif [ "${{ github.ref_name }}" != "main" ]; then
            # Non-main branches produce preview deployments on the configured
            # provider; repos without DEPLOY_PROVIDER keep the CF default.
            TARGET="${DEPLOY_PROVIDER:-cloudflare-pages}"
          elif [ -n "$DEPLOY_PROVIDER" ]; then
            TARGET="$DEPLOY_PROVIDER"
          elif [ -n "$CF_API_TOKEN" ] || [ -n "$DEPLOY_TOKEN" ]; then
            # No DEPLOY_PROVIDER var (connected or pre-contract repos):
            # infer the provider from deploy credential presence.
            TARGET="cloudflare-pages"
          else
            TARGET="github-pages"
          fi

          # Credential model for the cloudflare-pages target: 'console' when
          # poko-console minted the repo (DEPLOY_API_BASE vend endpoint var
          # present) — DEPLOY_TOKEN is then an opaque site token exchanged
          # for a project-scoped JWT. 'direct' otherwise — the repo holds
          # its own provider credential under DEPLOY_TOKEN (connected
          # sites, Bunny later) or legacy CLOUDFLARE_API_TOKEN.
          if [ "$TARGET" = "cloudflare-pages" ]; then
            if [ -n "$DEPLOY_API_BASE" ]; then
              echo "deploy_path=console" >> "$GITHUB_OUTPUT"
            else
              echo "deploy_path=direct" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "deployment_target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Get Bun version
        id: bun
        if: steps.check.outputs.should_skip == 'false'
        run: |
          if [ -n "$BUN_VERSION" ]; then
            echo "version=$BUN_VERSION" >> "$GITHUB_OUTPUT"
          else
            # Read from package.json engines.bun (strip any leading >=, ^, ~)
            VERSION=$(jq -r '.engines.bun' package.json | sed 's/[>=~^]//g')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  # Validate required secrets and configurations
  validate:
    name: Validate Configuration
    needs: setup
    runs-on: ubuntu-latest
    if: needs.setup.outputs.should_skip == 'false'
    outputs:
      can_deploy: ${{ steps.validate.outputs.can_deploy }}
      error_message: ${{ steps.validate.outputs.error_message }}
    steps:
      - name: Validate deployment configuration
        id: validate
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TARGET="${{ needs.setup.outputs.deployment_target }}"
          DEPLOY_PATH="${{ needs.setup.outputs.deploy_path }}"
          CAN_DEPLOY="true"
          ERROR_MSG=""

          case "$TARGET" in
            cloudflare-pages)
              if [ "$DEPLOY_PATH" = "console" ]; then
                if [ -z "$DEPLOY_TOKEN" ] || [ -z "$DEPLOY_API_BASE" ]; then
                  CAN_DEPLOY="false"
                  ERROR_MSG="Missing console deploy config: DEPLOY_TOKEN secret and/or DEPLOY_API_BASE var"
                fi
              elif [ -z "${DEPLOY_TOKEN:-$CF_API_TOKEN}" ] || [ -z "${DEPLOY_ACCOUNT_ID:-$CF_ACCOUNT_ID}" ]; then
                CAN_DEPLOY="false"
                ERROR_MSG="Missing deploy credentials: DEPLOY_TOKEN/DEPLOY_ACCOUNT_ID (or legacy CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID)"
              fi
              ;;
            github-pages)
              # GitHub Pages doesn't require additional secrets
              echo "GitHub Pages deployment configuration is valid"
              ;;
            *)
              CAN_DEPLOY="false"
              ERROR_MSG="Unsupported deployment target '$TARGET' (DEPLOY_PROVIDER: '${DEPLOY_PROVIDER:-unset}')"
              ;;
          esac

          echo "can_deploy=$CAN_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "error_message=$ERROR_MSG" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [setup, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      needs.setup.outputs.should_skip == 'false' && 
      needs.validate.outputs.can_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Select the runtime before provisioning Bun so the npm/Node fallback
      # stays reachable: Setup Bun only runs when Bun is already in context
      # (pinning its version); otherwise the job goes straight to Node.
      - name: Detect runtime
        id: runtime
        run: |
          if command -v bun >/dev/null 2>&1; then
            echo "bun=true" >> "$GITHUB_OUTPUT"
          else
            echo "bun=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.runtime.outputs.bun == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ needs.setup.outputs.bun_version }}

      - name: Setup Node
        if: steps.runtime.outputs.bun != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

      - name: Cache Bun dependencies
        if: steps.runtime.outputs.bun == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache build assets
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-assets-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-assets-

      - name: Install dependencies
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun install
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        working-directory: ${{ env.BUILD_PATH }}

      # Exposes every GitHub Actions secret as an env var for subsequent steps,
      # so any secret you add in repo settings is available in process.env at build time.
      # Multiline-safe; values remain masked in logs. Excludes the auto github_token.
      - name: Export secrets to environment
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          echo "$SECRETS_JSON" \
            | jq -r 'to_entries[] | select(.key != "github_token") | "\(.key)<<__POKO_EOF__\n\(.value)\n__POKO_EOF__"' \
            >> "$GITHUB_ENV"

      # Exposes the URL configured in the repository Pages settings, custom
      # domain included, so the build knows whether it is served from a
      # `/<repo>/` sub-folder or from the root of a domain.
      - name: Setup Pages
        id: pages
        if: needs.setup.outputs.deployment_target == 'github-pages'
        uses: actions/configure-pages@v5

      - name: Build with 11ty
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun run build
          else
            npm run build
          fi
        working-directory: ${{ env.BUILD_PATH }}
        env:
          DEPLOYMENT_TARGET: ${{ needs.setup.outputs.deployment_target }}
          GITHUB_PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: ${{ env.BUILD_PATH }}/dist
          retention-days: 1
          # v4+ excludes dotfiles by default; dist may carry .assetsignore,
          # .well-known, .nojekyll — keep them.
          include-hidden-files: true

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: [setup, validate, build]
    runs-on: ubuntu-latest
    if: |
      needs.setup.outputs.should_skip == 'false' && 
      needs.validate.outputs.can_deploy == 'true' &&
      needs.setup.outputs.deployment_target == 'github-pages'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: [setup, validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      needs.setup.outputs.should_skip == 'false' && 
      needs.validate.outputs.can_deploy == 'true' &&
      needs.setup.outputs.deployment_target == 'cloudflare-pages'
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.url || steps.deploy_console.outputs.url }}
    steps:
      # Needed by the console path: the deploy script lives in the repo
      # checkout (this repo IS the poko-website-builder package).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist

      - name: Deploy to Cloudflare Pages (direct)
        id: deploy
        if: needs.setup.outputs.deploy_path == 'direct'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.DEPLOY_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.DEPLOY_PROJECT || vars.CLOUDFLARE_PROJECT_NAME || github.event.repository.name }}
          directory: dist
          # main -> production; any other branch -> preview URL (<branch>.<project>.pages.dev)
          branch: ${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "3"

      - name: Deploy to Cloudflare Pages (console)
        id: deploy_console
        if: needs.setup.outputs.deploy_path == 'console'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT || vars.CLOUDFLARE_PROJECT_NAME || github.event.repository.name }}
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/deploy-cloudflare.mjs dist
      # For using wrangler-action instead of pages-action (deprecated):
      # - name: Deploy to Cloudflare Pages
      #   id: deploy
      #   uses: cloudflare/wrangler-action@v3
      #   with:
      #     apiToken: ${{ secrets.DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.DEPLOY_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     command: pages deploy dist --project-name=${{ vars.DEPLOY_PROJECT || vars.CLOUDFLARE_PROJECT_NAME || github.event.repository.name }} --branch=${{ github.head_ref || github.ref_name }}

  # Report skipped builds
  report-skipped:
    name: Build Skipped
    needs: [setup, validate]
    runs-on: ubuntu-latest
    if: |
      needs.setup.outputs.should_skip == 'true' || 
      needs.validate.outputs.can_deploy == 'false'
    steps:
      - name: Report skip reason
        run: |
          if [ "${{ needs.setup.outputs.should_skip }}" = "true" ]; then
            echo "⏭️ Build skipped: [skip ci] found in commit message"
          else
            echo "❌ Build skipped: ${{ needs.validate.outputs.error_message }}"
          fi
